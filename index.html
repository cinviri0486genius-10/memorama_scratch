<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorama de Scratch</title>
    <style>
        :root {
            --bg-color: #F9F9F9;
            --scratch-orange: #FF8C1A; /* Color del bloque Al hacer clic */
            --scratch-blue: #4C97FF;   /* Color de los bloques de Movimiento */
            --scratch-purple: #9966FF; /* Color de los bloques de Apariencia */
            --scratch-green: #5CB3FF;  /* Fondo suave estilo Scratch */
            --card-front: #FFFFFF;
            --text-dark: #575E75;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            background-image: radial-gradient(#E0E4EC 2px, transparent 2px);
            background-size: 20px 20px; /* Fondo de cuadrícula limpia */
            color: var(--text-dark);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .header-container {
            text-align: center;
            background-color: white;
            padding: 15px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            border: 2px solid #E0E4EC;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 5px 0;
            color: var(--scratch-orange);
            font-size: 2rem;
        }

        p {
            font-size: 1.1rem;
            margin: 0;
            font-weight: bold;
        }

        /* Contenedor del tablero */
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            max-width: 600px;
            width: 100%;
        }

        /* Estructura 3D de las cartas */
        .card {
            aspect-ratio: 1;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08);
            border-radius: 12px;
        }

        /* Clases para voltear y emparejar */
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card.matched .card-inner {
            box-shadow: 0 0 15px #0FBD8C; /* Verde de Scratch para aciertos */
            border-radius: 12px;
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.95rem;
            padding: 12px;
            box-sizing: border-box;
            user-select: none;
        }

        /* Parte trasera de la carta (Estilo Bloque de Scratch) */
        .card-back {
            background-color: var(--scratch-purple);
            color: white;
            font-size: 2.5rem;
            border: 3px solid #7F4DFF;
        }

        /* Parte delantera de la carta (Muestra el término de Scratch) */
        .card-front {
            background-color: var(--card-front);
            color: var(--text-dark);
            transform: rotateY(180deg);
            border: 3px solid var(--scratch-orange);
            word-break: break-word;
        }

        /* Colores dinámicos según el tipo de bloque que se adivine */
        .card.matched .card-front {
            border-color: #0FBD8C;
            background-color: #E6F9F3;
            color: #0FBD8C;
        }

        /* Botón de reinicio al estilo Scratch */
        .reset-btn {
            margin-top: 25px;
            padding: 12px 28px;
            font-size: 1.1rem;
            background-color: var(--scratch-orange);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #D97312;
            transition: all 0.1s ease;
        }

        .reset-btn:hover {
            background-color: #FFA133;
        }

        .reset-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #D97312;
        }

        /* Ajustes para pantallas pequeñas */
        @media (max-width: 480px) {
            .game-board {
                gap: 8px;
            }
            .card-front {
                font-size: 0.75rem;
                padding: 4px;
            }
            .card-back {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Scratch juego de memoria</h1>
        <p>Movimientos: <span id="moves">0</span></p>
    </div>

    <div class="game-board" id="board"></div>

    <button class="reset-btn" onclick="resetGame()">Reiniciar bloques</button>

    <script>
        // Lista de conceptos y bloques clave de Scratch (8 parejas = 16 cartas)
        const keywords = [
            '🐱 Gato Scratch', 
            '🟢 Al hacer clic en Bandera', 
            '🔄 Por siempre', 
            '🚀 Mover 10 pasos', 
            '💬 Decir Hola', 
            '🎨 Objeto (Sprite)', 
            '⚙️ Si [entonces]', 
            '🔊 Tocar sonido'
        ];

        let cardValues = [...keywords, ...keywords];
        let flippedCards = [];
        let matchedCount = 0;
        let moves = 0;
        let lockBoard = false;

        const board = document.getElementById('board');
        const movesDisplay = document.getElementById('moves');

        // Algoritmo de Fisher-Yates para barajar
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Crear el tablero
        function createBoard() {
            board.innerHTML = '';
            shuffle(cardValues);
            
            cardValues.forEach((value, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.value = value;
                card.dataset.index = index;

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-back">☁️</div>
                        <div class="card-front">${value}</div>
                    </div>
                `;

                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard) return;
            if (this.classList.contains('flipped') || this.classList.contains('matched')) return;

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                checkForMatch();
            }
        }

        function checkForMatch() {
            lockBoard = true;
            moves++;
            movesDisplay.innerText = moves;

            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.value === card2.dataset.value;

            if (isMatch) {
                disableCards(card1, card2);
            } else {
                unflipCards(card1, card2);
            }
        }

        function disableCards(card1, card2) {
            card1.classList.add('matched');
            card2.classList.add('matched');
            
            matchedCount += 2;
            resetTurn();

            if (matchedCount === cardValues.length) {
                setTimeout(() => alert(`¡Reto completado! Uniste todos los bloques en ${moves} movimientos.`), 500);
            }
        }

        function unflipCards(card1, card2) {
            setTimeout(() => {
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
                resetTurn();
            }, 1000);
        }

        function resetTurn() {
            flippedCards = [];
            lockBoard = false;
        }

        function resetGame() {
            flippedCards = [];
            matchedCount = 0;
            moves = 0;
            movesDisplay.innerText = moves;
            lockBoard = false;
            createBoard();
        }

        // Iniciar juego
        createBoard();
    </script>
</body>
</html>
